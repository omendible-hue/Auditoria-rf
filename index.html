<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#101a26;--mut:#556476;--line:#cfd7df;--head:#0b1f33;--acc:#c2490a;--accink:#fff;--ok:#13783f;--warn:#9a6200;--bad:#b3261e;--okbg:#dff3e7;--warnbg:#fdefd2;--badbg:#fbe1df;--field:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0c1218;--card:#161f29;--ink:#e8eef4;--mut:#9aabbd;--line:#2c3a48;--head:#07121e;--acc:#ff7a33;--accink:#1a0b02;--ok:#5fd694;--warn:#ffc252;--bad:#ff8a80;--okbg:#12331f;--warnbg:#3a2c0c;--badbg:#401a18;--field:#0f1720}}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--head);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
header h1{font-size:17px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:transparent;color:#fff;border:1px solid #ffffff55;min-height:36px}
main{max-width:760px;margin:0 auto;padding:12px 12px calc(90px + env(safe-area-inset-bottom))}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav a{flex:1;text-align:center;padding:8px 2px;color:var(--mut);text-decoration:none;font-size:12px}

.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.tabs a,.chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:7px 14px;text-decoration:none;font-size:14px;min-height:36px}
.tabs a.on,.chip.on{background:var(--head);color:#fff;border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card h2{font-size:16px;margin-bottom:8px}
.card h3{font-size:14px;margin:12px 0 6px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:8px}
input,select,textarea{display:block;width:100%;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:10px;min-height:44px;margin-top:3px}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
input:disabled,select:disabled,textarea:disabled{opacity:.75}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 8px}
button,.btn{font:inherit;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:9px 14px;min-height:44px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button.pri,.btn.pri{background:var(--acc);color:var(--accink);border-color:var(--acc)}
button.dan{color:var(--bad);border-color:var(--bad)}
button.sm{min-height:36px;padding:5px 10px;font-size:13px}
button:disabled{opacity:.45}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.sp{justify-content:space-between}
.full{width:100%}
.mut{color:var(--mut);font-size:13px}
.tag{display:inline-block;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700;background:var(--bg);color:var(--ink)}
.tag.ok{background:var(--okbg);color:var(--ok)}.tag.warn{background:var(--warnbg);color:var(--warn)}.tag.bad{background:var(--badbg);color:var(--bad)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.kpi b{display:block;font-size:26px;font-variant-numeric:tabular-nums}
.kpi small{color:var(--mut)}
.item{display:block;width:100%;text-align:left;text-decoration:none;color:inherit;border-top:1px solid var(--line);padding:10px 0}
.item:first-of-type{border-top:0}
table.par{width:100%;border-collapse:collapse;table-layout:fixed}
table.par th{font-size:12px;color:var(--mut);font-weight:600;padding:2px 3px;text-align:center}
table.par th:first-child,table.par td:first-child{width:27%;text-align:left;font-size:13px}
table.par td{padding:3px;vertical-align:middle}
table.par input{padding:8px 4px;text-align:center;font-variant-numeric:tabular-nums;margin:0}
input.oot{background:var(--badbg);border-color:var(--bad)}
input.chg{border:2px solid var(--acc);font-weight:700}
.derived{font-size:13px;margin-top:8px}
.derived .tag{margin:0 4px 4px 0}
svg.rose{width:100%;max-width:280px;display:block;margin:6px auto}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.seg button{border:0;border-radius:0;min-height:40px;min-width:48px;padding:4px 8px;font-size:12px;border-left:1px solid var(--line)}
.seg button.on.ok{background:var(--ok);color:var(--card)}.seg button.on.nok{background:var(--bad);color:var(--card)}.seg button.on.na{background:var(--mut);color:var(--card)}
.chk{border-top:1px solid var(--line);padding:9px 0}
.chk .row{flex-wrap:nowrap;justify-content:space-between}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:8px}
.ph{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;aspect-ratio:1;background:var(--bg)}
.ph img{width:100%;height:100%;object-fit:cover;display:block;cursor:pointer}
.slot{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line);padding:8px 0;flex-wrap:wrap}

#modal img.big{width:100%;border-radius:8px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;z-index:30;background:#101a26;color:#fff;padding:10px 16px;border-radius:9px;font-size:14px;display:none;max-width:90%;border:1px solid var(--acc)}

pre.msg{white-space:pre-wrap;word-break:break-word;background:var(--bg);border-radius:8px;padding:10px;font:13px/1.45 ui-monospace,monospace;margin-bottom:10px}
canvas.sign{width:100%;height:150px;border:1px dashed var(--mut);border-radius:8px;background:#fff;touch-action:none}
#print{display:none}
@media print{header,nav,main,#modal,#toast{display:none!important}#print{display:block}body{background:#fff}}
@media (max-width:430px){.g3{grid-template-columns:1fr 1fr}}
</style>

<body>
<header><button id="back" aria-label="Volver" hidden>‹</button><h1 id="title">Auditoría RF Campo</h1></header>
<main></main>
<nav><a href="#/home" data-v="home"><span>🏠</span>Inicio</a><a href="#/audits" data-v="audits"><span>📋</span>Auditorías</a><a href="#/findings" data-v="findings"><span>⚠️</span>Hallazgos</a><a href="#/tools" data-v="tools"><span>🧭</span>Herramientas</a><a href="#/settings" data-v="settings"><span>⚙️</span>Ajustes</a></nav>
<div id="modal"></div><div id="toast" role="status"></div><div id="print"></div>
<script>
'use strict';
const VERSION='1.0.0';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const now=()=>new Date().toISOString();
const num=v=>{if(v===null||v===undefined)return null;const s=String(v).trim().replace(',','.');if(s==='')return null;const n=Number(s);return Number.isFinite(n)?n:null};
const r1=n=>n===null?null:Math.round(n*10)/10;
const fmt=n=>n===null||n===undefined?'—':String(r1(n)).replace('.',S.settings.dec);
const pad=n=>String(n).padStart(2,'0');
const dt=iso=>{if(!iso)return'—';const d=new Date(iso);return`${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`};
const today=()=>{const d=new Date();return`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const slug=s=>String(s||'sitio').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9_-]+/g,'_').slice(0,60)||'sitio';
const getPath=(o,p)=>p.split('.').reduce((a,k)=>a?.[k],o);
const setPath=(o,p,v)=>{const k=p.split('.'),last=k.pop();k.reduce((a,x)=>a[x]??(a[x]={}),o)[last]=v};

/* ---------- Catálogos ---------- */
const AREAS=['O&M','Operaciones (NOC)','Optimización RF','Transmisión','Energía','Infraestructura','Seguridad'];
const SEVS={'Crítica':{h:4,c:'bad',d:'Servicio caído o riesgo a personas'},'Alta':{h:24,c:'bad',d:'Degradación fuerte de servicio'},'Media':{h:72,c:'warn',d:'Afecta calidad o puede escalar'},'Baja':{h:360,c:'',d:'Mejora o preventivo'}};
const STATES=['Abierto','Escalado','En proceso','Resuelto','Cerrado'];
const DONE=['Resuelto','Cerrado'];
const CATS={'Parámetros RF':'Optimización RF','Cruce de sectores':'O&M','Antena / herrajes':'O&M','Cableado / conectores':'O&M','RET / AISG':'O&M','RRU / equipo de radio':'O&M','Alarmas / servicio':'Operaciones (NOC)','Obstrucción / entorno':'Optimización RF','Interferencia':'Optimización RF','Energía':'Energía','Transmisión':'Transmisión','Torre / infraestructura':'Infraestructura','Climatización':'O&M','Vandalismo / hurto':'Seguridad','Seguridad industrial':'Infraestructura','Otro':'O&M'};
const REASONS=['Ajuste a diseño','Optimización de cobertura','Reducción de sobrealcance (overshooting)','Reducción de interferencia','Atención a reclamo','Mejora de KPI','Corrección de cruce de sectores','Obstrucción en el sector','Otro'];
const VISIT_REASONS=['Auditoría programada','Optimización','KPI degradado','Reclamo de cliente','Post-instalación / swap','Drive test','Falla / emergencia'];
const BANDS=['GSM 850','GSM 900','UMTS 850','UMTS 1900','LTE 700','LTE 850','LTE 1800','LTE AWS','LTE 1900','LTE 2600','NR 3500'];
const SAFETY=[['perm','Acceso al sitio autorizado'],['ats','Análisis de riesgo (ATS) realizado'],['epp','EPP completo: casco, arnés, línea de vida'],['alt','Personal certificado para trabajo en altura'],['clima','Condiciones climáticas aptas'],['rf','Exposición RF controlada (potencia reducida o distancia segura)'],['noc','NOC notificado del inicio y ventana de trabajo'],['resc','Plan de rescate y comunicación definidos']];
const CHECK=[
['Antenas y radio',[['ant_fij','Fijación y herrajes de antenas','Antena / herrajes'],['ant_rad','Radomos sin daños','Antena / herrajes'],['jump','Jumpers sin dobleces ni daños','Cableado / conectores'],['conn','Conectores sellados contra intemperie','Cableado / conectores'],['ret','RET / AISG conectado y respondiendo','RET / AISG'],['rru','RRU fijas y sin alarmas','RRU / equipo de radio'],['etiq','Etiquetado de cables y sectores','Cableado / conectores']]],
['Torre e infraestructura',[['torre','Estructura sin corrosión ni deformaciones','Torre / infraestructura'],['torn','Tornillería completa','Torre / infraestructura'],['bal','Balizaje operativo','Torre / infraestructura'],['tierra','Puesta a tierra y pararrayos','Torre / infraestructura'],['lvida','Escalera y línea de vida','Seguridad industrial']]],
['Energía y sala de equipos',[['ac','Energía comercial y tablero','Energía'],['rect','Rectificador sin alarmas','Energía'],['bat','Banco de baterías completo y en buen estado','Energía'],['planta','Planta eléctrica y combustible','Energía'],['aa','Climatización','Climatización']]],
['Transmisión',[['mw','Antenas MW fijas y alineadas','Transmisión'],['fo','Fibra / cableado IF en buen estado','Transmisión']]],
['Seguridad física y entorno',[['cerca','Cerca, puertas y candados','Vandalismo / hurto'],['vand','Sin señales de hurto o vandalismo','Vandalismo / hurto'],['los','Sectores sin obstrucciones cercanas','Obstrucción / entorno'],['interf','Sin repetidores o fuentes de interferencia visibles','Interferencia']]],
['Verificación al finalizar',[['alarm','Alarmas verificadas con NOC','Alarmas / servicio'],['voz','Prueba de voz exitosa','Alarmas / servicio'],['datos','Prueba de datos exitosa','Alarmas / servicio'],['kpi','Seguimiento de KPI acordado','Parámetros RF'],['limp','Sitio limpio y cerrado','Otro']]]];
const SITE_SLOTS=[['s_general','Vista general del sitio',true],['s_torre','Torre / estructura completa',true],['s_acceso','Acceso y cerca',false],['s_sala','Sala de equipos / gabinetes',false],['s_energia','Energía y baterías',false],...[0,45,90,135,180,225,270,315].map(a=>['pan_'+a,`Panorámica ${a}°`,false])];
const ANT_SLOTS=[['inst','Instalación de la antena',true],['etq','Etiqueta / serial',false],['az_a','Azimut ANTES',false],['tilt_a','Inclinómetro ANTES',true],['az_d','Azimut DESPUÉS',false],['tilt_d','Inclinómetro DESPUÉS',false],['vista','Vista desde el sector (entorno)',true]];

/* ---------- Almacenamiento (IndexedDB con respaldo en memoria) ---------- */
const DB={db:null,mem:{audits:new Map,photos:new Map,sites:new Map,meta:new Map},
 open(){return new Promise(res=>{try{const q=indexedDB.open('auditoriaRF',1);
  q.onupgradeneeded=()=>{const d=q.result;d.createObjectStore('audits',{keyPath:'id'});d.createObjectStore('photos',{keyPath:'id'}).createIndex('audit','auditId');d.createObjectStore('sites',{keyPath:'code'});d.createObjectStore('meta',{keyPath:'id'})};
  q.onsuccess=()=>{this.db=q.result;res(true)};q.onerror=()=>res(false);setTimeout(()=>res(!!this.db),3000)}catch(e){res(false)}})},
 run(store,mode,fn){return new Promise((res,rej)=>{const t=this.db.transaction(store,mode);const q=fn(t.objectStore(store));t.oncomplete=()=>res(q?.result);t.onerror=t.onabort=()=>rej(t.error)})},
 async all(s){return this.db?this.run(s,'readonly',o=>o.getAll()):[...this.mem[s].values()]},
 async get(s,k){return this.db?this.run(s,'readonly',o=>o.get(k)):this.mem[s].get(k)},
 async put(s,v){if(!this.db){this.mem[s].set(v.id??v.code,v);return}try{await this.run(s,'readwrite',o=>{o.put(v)})}catch(e){toast('⚠️ No se pudo guardar. Revise el espacio libre del teléfono.');throw e}},
 async del(s,k){if(!this.db){this.mem[s].delete(k);return}await this.run(s,'readwrite',o=>{o.delete(k)})},
 async photos(aid){return this.db?this.run('photos','readonly',o=>o.index('audit').getAll(aid)):[...this.mem.photos.values()].filter(p=>p.auditId===aid)}
};

/* ---------- Estado ---------- */
const DEFAULTS={id:'settings',auditor:'',company:'',declination:-13.4,tiltZero:0,dec:',',stamp:true,tol:{az:5,mt:1,et:0.5,h:1},contacts:{},lastBackup:null};
const S={settings:structuredClone(DEFAULTS),audits:[],sites:[],photos:[],urls:new Map,filter:{area:'',sev:'',st:'open'},q:''};
const saveSettings=()=>DB.put('meta',S.settings);
let saveTimer=null,dirty=new Set;
function touch(a){a.updatedAt=now();dirty.add(a);clearTimeout(saveTimer);saveTimer=setTimeout(flush,250)}
async function flush(){clearTimeout(saveTimer);const list=[...dirty];dirty.clear();for(const a of list)await DB.put('audits',a)}

/* ---------- Modelo ---------- */
const newBand=(name='LTE 1800')=>({id:uid(),name,plan:{et:'',pci:''},found:{et:''},final:{et:''},test:{pci:'',rsrp:'',sinr:'',dl:''}});
const newAnt=(name='Antena 1')=>({id:uid(),name,model:'',serial:'',vbw:'6,5',plan:{az:'',mt:'',h:''},found:{az:'',mt:'',h:''},final:{az:'',mt:'',h:''},reason:'',authBy:'',changedAt:'',notes:'',bands:[newBand()]});
const newSector=i=>({id:uid(),name:'Sector '+i,antennas:[newAnt()]});
function newAudit(site){
 const a={id:uid(),createdAt:now(),updatedAt:now(),status:'en_curso',closedAt:null,
  site:{code:'',name:'',region:'',state:'',type:'Torre autosoportada',lat:'',lon:'',height:'',address:''},
  visit:{date:today(),start:new Date().toTimeString().slice(0,5),end:'',auditors:S.settings.auditor,crew:'',reason:VISIT_REASONS[0],ticket:'',instrument:'',weather:'',gps:null},
  safety:{},check:{},sectors:[1,2,3].map(newSector),findings:[],seq:0,conclusion:'',receivedBy:'',signature:'',closeNote:''};
 if(site){Object.assign(a.site,site.info);a.sectors=structuredClone(site.sectors);a.sectors.forEach(s=>{s.id=uid();s.antennas.forEach(n=>{n.id=uid();n.bands.forEach(b=>b.id=uid())})})}
 return a}
const antennas=a=>a.sectors.flatMap((s,si)=>s.antennas.map((n,ai)=>({s,n,si,ai,p:`sectors.${si}.antennas.${ai}`})));

/* ---------- Cálculos RF ---------- */
const angDiff=(a,b)=>((a-b+540)%360)-180;
const delta=(k,x,y)=>{const a=num(x),b=num(y);if(a===null||b===null)return null;return k==='az'?angDiff(a,b):a-b};
const outTol=(k,val,plan)=>{const d=delta(k,val,plan);return d!==null&&Math.abs(d)>S.settings.tol[k]+1e-9};
const changed=(k,found,fin)=>{const d=delta(k,fin,found);return d!==null&&Math.abs(d)>1e-9};
const antChanged=n=>['az','mt','h'].some(k=>changed(k,n.found[k],n.final[k]))||n.bands.some(b=>changed('et',b.found.et,b.final.et));
function antStats(n){
 const items=[...['az','mt','h'].map(k=>({k,p:n.plan[k],f:n.found[k],z:n.final[k]})),...n.bands.map(b=>({k:'et',p:b.plan.et,f:b.found.et,z:b.final.et}))];
 return{changes:items.filter(i=>changed(i.k,i.f,i.z)).length,ootFound:items.filter(i=>outTol(i.k,i.f,i.p)).length,ootFinal:items.filter(i=>outTol(i.k,i.z,i.p)).length,missFound:items.filter(i=>i.k!=='h'&&num(i.f)===null).length,missFinal:items.filter(i=>i.k!=='h'&&num(i.z)===null).length}}
function footprint(h,tilt,vbw){
 if(h===null||tilt===null||h<=0)return null;const d=g=>g>0&&g<90?h/Math.tan(g*Math.PI/180):null;
 return{tilt,near:d(tilt+(vbw||6.5)/2),main:d(tilt),far:d(tilt-(vbw||6.5)/2)}}
const dist=m=>m===null?'horizonte':m>=1000?fmt(m/1000)+' km':Math.round(m)+' m';
function haversine(a,b){const R=6371000,t=Math.PI/180,dl=(b.lat-a.lat)*t,dn=(b.lon-a.lon)*t;const x=Math.sin(dl/2)**2+Math.cos(a.lat*t)*Math.cos(b.lat*t)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function bearing(a,b){const t=Math.PI/180,y=Math.sin((b.lon-a.lon)*t)*Math.cos(b.lat*t),x=Math.cos(a.lat*t)*Math.sin(b.lat*t)-Math.sin(a.lat*t)*Math.cos(b.lat*t)*Math.cos((b.lon-a.lon)*t);return(Math.atan2(y,x)/t+360)%360}
/* PCI detectado distinto al esperado: ¿pertenece a otro sector en la misma banda? */
function pciCheck(a,si,b){const det=String(b.test.pci||'').trim(),exp=String(b.plan.pci||'').trim();if(!det||!exp)return null;if(det===exp)return{ok:true,msg:`PCI ${det} correcto (${b.name})`};
 for(let i=0;i<a.sectors.length;i++)if(i!==si&&a.sectors[i].antennas.some(n=>n.bands.some(x=>x.name===b.name&&String(x.plan.pci).trim()===det)))return{ok:false,msg:`Posible cruce en ${b.name}: se mide PCI ${det}, que pertenece a ${a.sectors[i].name} (esperado ${exp})`};
 return{ok:false,msg:`PCI distinto en ${b.name}: esperado ${exp}, medido ${det}`}}
function rose(list,size=240){
 const c=120,pt=(az,r)=>[c+r*Math.sin(az*Math.PI/180),c-r*Math.cos(az*Math.PI/180)].map(v=>v.toFixed(1));
 let g=`<circle cx="120" cy="120" r="92" fill="none" stroke="#8494a5" stroke-width="1"/><circle cx="120" cy="120" r="46" fill="none" stroke="#8494a5" stroke-dasharray="2 4"/>`;
 for(let a=0;a<360;a+=30){const[x,y]=pt(a,106);g+=`<text x="${x}" y="${+y+4}" text-anchor="middle" font-size="10" fill="#8494a5">${a===0?'N':a+'°'}</text>`}

function validate(a){const err=[],warn=[];
 if(!a.site.code.trim())err.push('Falta el código del sitio');
 if(!a.visit.auditors.trim())err.push('Falta el nombre del auditor');
 if(!a.visit.gps)warn.push('No se capturó la posición GPS en sitio');
 else{const la=num(a.site.lat),lo=num(a.site.lon);if(la!==null&&lo!==null){const d=haversine({lat:la,lon:lo},a.visit.gps);if(d>150)warn.push(`El GPS está a ${dist(d)} de las coordenadas del plan`)}}
 const sm=SAFETY.filter(([k])=>!a.safety[k]).length,sn=SAFETY.filter(([k])=>a.safety[k]==='nok').length;
 if(sm)err.push(`Seguridad: ${sm} punto(s) sin responder`);if(sn)warn.push(`Seguridad: ${sn} punto(s) No OK`);
 for(const{s,n,si}of antennas(a)){const t=antStats(n),w=`${s.name} · ${n.name}`;
  if(t.missFound)err.push(`${w}: faltan ${t.missFound} valor(es) encontrados`);
  if(t.missFinal)err.push(`${w}: faltan ${t.missFinal} valor(es) finales`);
  if(t.changes&&(!n.reason||!n.authBy.trim()))err.push(`${w}: hay cambios sin motivo o sin quién autoriza`);
  if(t.ootFinal&&!a.findings.some(f=>f.antennaId===n.id))err.push(`${w}: queda fuera de tolerancia y no tiene hallazgo`);
  for(const b of n.bands){const c=pciCheck(a,si,b);if(c&&!c.ok)warn.push(`${w}: ${c.msg}`)}
  for(const[k,l,req]of ANT_SLOTS){const need=req||(k==='tilt_d'&&(changed('mt',n.found.mt,n.final.mt)||n.bands.some(b=>changed('et',b.found.et,b.final.et))))||(k==='az_d'&&changed('az',n.found.az,n.final.az));if(need&&!S.photos.some(p=>p.auditId===a.id&&p.tag===`${n.id}:${k}`))warn.push(`${w}: falta foto "${l}"`)}}
 for(const[k,l,req]of SITE_SLOTS)if(req&&!S.photos.some(p=>p.auditId===a.id&&p.tag===k))warn.push(`Falta foto "${l}"`);
 const items=CHECK.flatMap(g=>g[1]),cm=items.filter(([k])=>!a.check[k]?.s).length;if(cm)warn.push(`Checklist: ${cm} punto(s) sin responder`);
 for(const[k,l]of items)if(a.check[k]?.s==='nok'&&!a.findings.some(f=>f.itemKey===k))err.push(`Checklist "${l}" está No OK y no tiene hallazgo`);
 for(const f of a.findings){if(!f.title.trim())err.push(`Hallazgo ${pad(f.num)} sin título`);if(['Crítica','Alta'].includes(f.severity)&&f.status==='Abierto')warn.push(`Hallazgo ${pad(f.num)} (${f.severity}) aún no se ha escalado`)}
 if(!a.signature)warn.push('Falta la firma del auditor');
 return{err,warn}}

const CRC=Uint32Array.from({length:256},(_,n)=>{for(let k=0;k<8;k++)n=n&1?0xedb88320^(n>>>1):n>>>1;return n>>>0});
const crc32=u=>{let c=0xffffffff;for(let i=0;i<u.length;i++)c=CRC[(c^u[i])&255]^(c>>>8);return(c^0xffffffff)>>>0};
async function zip(files){const enc=new TextEncoder,parts=[],central=[];let off=0;const d=new Date,time=d.getHours()<<11|d.getMinutes()<<5|d.getSeconds()>>1,date=(d.getFullYear()-1980)<<9|(d.getMonth()+1)<<5|d.getDate();

  const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x800,true);h.setUint16(10,time,true);h.setUint16(12,date,true);h.setUint32(14,crc,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);h.setUint16(26,name.length,true);
  const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x800,true);c.setUint16(12,time,true);c.setUint16(14,date,true);c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);c.setUint16(28,name.length,true);c.setUint32(42,off,true);

async function buildPackage(list,full){const files=[],meta=[],ph=await photosFor(list);
 for(const a of list)ph.filter(p=>p.auditId===a.id).forEach((p,i)=>{const file=photoName(a,p,i);files.push({name:file,data:p.blob});const{blob,...m}=p;meta.push({...m,file})});
 const data={app:'auditoria-rf',version:VERSION,exportedAt:now(),audits:list,photos:meta};if(full){data.sites=S.sites;data.settings=S.settings}
 files.unshift({name:'datos.json',data:JSON.stringify(data)});
 files.push({name:'parametros.csv',data:toCSV(paramRows(list))},{name:'hallazgos.csv',data:toCSV(findingRows(list.flatMap(a=>a.findings.map(f=>({a,f})))))});
 if(!full&&list.length===1)files.push({name:'informe.html',data:await reportHTML(list[0])});

const okId=v=>typeof v==='string'&&/^[A-Za-z0-9_-]{1,40}$/.test(v);
/* Los paquetes vienen de otros teléfonos: se validan identificadores y valores de catálogo. */
function cleanAudit(a){if(!a||!okId(a.id)||!a.site||!a.visit||!Array.isArray(a.sectors)||!Array.isArray(a.findings))return null;
 const base=newAudit();const o={...base,...a,site:{...base.site,...a.site},visit:{...base.visit,...a.visit},safety:a.safety||{},check:a.check||{}};
 if(o.visit.gps&&!['lat','lon','acc'].every(k=>Number.isFinite(o.visit.gps[k])))o.visit.gps=null;
 if(o.sectors.some(s=>!okId(s.id)||!Array.isArray(s.antennas)||s.antennas.some(n=>!okId(n.id)||!n.plan||!n.found||!n.final||!Array.isArray(n.bands)||n.bands.some(b=>!okId(b.id)||!b.plan||!b.found||!b.final||!b.test))))return null;
 if(o.findings.some(f=>!okId(f.id)||!SEVS[f.severity]||!Number.isInteger(f.num)||!Array.isArray(f.history)))return null;
 if(typeof o.signature!=='string'||!/^(data:image\/png;base64,[A-Za-z0-9+/=]*)?$/.test(o.signature))o.signature='';
 return o}
async function importPackage(file){const files=await unzip(file),j=files.get('datos.json');if(!j)throw new Error('El ZIP no contiene datos de auditoría');
 const data=JSON.parse(await j.text());if(data.app!=='auditoria-rf')throw new Error('El paquete no es de esta aplicación');
 let added=0,skipped=0,bad=0;for(const raw of data.audits||[]){const a=cleanAudit(raw);if(!a){bad++;continue}
  const cur=S.audits.find(x=>x.id===a.id);if(cur&&cur.updatedAt>=a.updatedAt){skipped++;continue}
  if(cur){for(const p of await DB.photos(a.id))await DB.del('photos',p.id);S.audits.splice(S.audits.indexOf(cur),1)}
  for(const m of(data.photos||[]).filter(p=>p.auditId===a.id)){const b=files.get(m.file);if(!b||!okId(m.id)||typeof m.tag!=='string'||typeof m.takenAt!=='string')continue;const{file:_,...p}=m;if(p.gps&&!Number.isFinite(p.gps.lat))p.gps=null;await DB.put('photos',{...p,blob:new Blob([b],{type:'image/jpeg'})})}
  await DB.put('audits',a);S.audits.push(a);added++}
 for(const s of data.sites||[])if(s?.code&&s.info&&Array.isArray(s.sectors)&&!S.sites.some(x=>x.code===s.code)){await DB.put('sites',s);S.sites.push(s)}
 S.photos=[];return{added,skipped,bad}}
